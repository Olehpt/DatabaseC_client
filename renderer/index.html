<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Database Client</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <h1>Database Client</h1>

    <div id="connectionStatus" class="status">
        Disconnected
    </div>
</header>

<main class="main">

    <aside class="sidebar">

        <h2>Databases</h2>

        <button id="loadDatabases">
            Load databases
        </button>

        <div id="databaseList" class="database-list">
            <p class="placeholder">
                No databases loaded
            </p>
        </div>

    </aside>

    <section class="content">

        <div class="content-header">
            <h2 id="tableTitle">Select a table</h2>
        </div>

        <div id="tableInfo" class="table-info">
            <p class="placeholder">
                Select a database and table.
            </p>
        </div>

        <div id="tableContainer" class="table-container">
        </div>

    </section>

</main>

<script src="renderer.js"></script>

</body>
</html>
