<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Database Client</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <h1>Database Client</h1>
    </header>

    <main class="main">

        <aside class="sidebar">
            <h2>Databases</h2>

            <div class="database-list">
                <p class="placeholder">
                    No databases loaded
                </p>
            </div>
        </aside>

        <section class="content">

            <div class="content-header">
                <h2>Welcome</h2>
            </div>

            <div class="content-body">
                <p>
                    Select a database to view its tables.
                </p>
            </div>

        </section>

    </main>

    <script src="renderer.js"></script>

</body>
</html>
