<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Database Client</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<header class="header">
    <h1>Database Client</h1>

    <div id="connectionStatus" class="status">
        Disconnected
    </div>
</header>

<main class="main">
    <aside class="sidebar">
        <h2>Databases</h2>

        <div class="action-panel">
            <input
                id="databaseNameInput"
                type="text"
                placeholder="Database name"
                maxlength="100"
                autocomplete="off"
            >

            <div class="action-row">
                <button id="createDatabase">
                    Create database
                </button>
            </div>
        </div>

        <button id="loadDatabases">
            Load databases
        </button>

        <div id="databaseList" class="database-list">
            <p class="placeholder">
                No databases loaded
            </p>
        </div>

        <div id="tableActions" class="action-panel hidden">
            <h3 id="selectedDatabaseTitle">
                Table actions
            </h3>

            <input
                id="tableNameInput"
                type="text"
                placeholder="Table name"
                maxlength="100"
                autocomplete="off"
            >

            <div class="action-row">
                <button id="createTable">
                    Create table
                </button>

                <button id="deleteTable" class="danger" disabled>
                    Delete selected table
                </button>
            </div>
        </div>
    </aside>

    <section class="content">
        <div class="content-header">
            <h2 id="tableTitle">Select a table</h2>
        </div>

        <div id="tableInfo" class="table-info">
            <p class="placeholder">
                Select a database and table.
            </p>
        </div>

        <div id="dataActions" class="data-actions hidden">
            <div class="action-panel data-action-panel">
                <h3>Columns</h3>

                <div class="form-grid">
                    <input
                        id="columnNameInput"
                        type="text"
                        placeholder="Column name"
                        maxlength="100"
                        autocomplete="off"
                    >

                    <select id="columnTypeInput">
                        <option value="integer">Integer</option>
                        <option value="real">Real</option>
                        <option value="char">Char</option>
                        <option value="string">String</option>
                    </select>

                    <button id="createColumn">
                        Add column
                    </button>
                </div>
            </div>

            <div class="action-panel data-action-panel">
                <h3 id="rowEditorTitle">Add row</h3>

                <div id="rowInputContainer" class="row-input-container">
                    <p class="placeholder">
                        Add at least one column first.
                    </p>
                </div>

                <div class="action-row row-editor-buttons">
                    <button id="saveRow" disabled>
                        Add row
                    </button>

                    <button id="cancelEditRow" class="hidden">
                        Cancel edit
                    </button>
                </div>
            </div>
        </div>

        <div id="tableContainer" class="table-container">
        </div>
    </section>
</main>

<script src="renderer.js"></script>
</body>
</html>
